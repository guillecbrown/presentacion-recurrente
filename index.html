<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación recurrente</title>
<style>
  :root { --tinta: #18181b; --gris: #71717a; --linea: #e4e4e7; --fondo: #f4f4f5; --acento: #1d4ed8; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px "Segoe UI", Arial, sans-serif; color: var(--tinta); background: var(--fondo); }
  #barra { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 18px;
           background: #fff; border-bottom: 1px solid var(--linea); }
  #barra strong { font-size: 15px; margin-right: 6px; }
  #barra .hueco { flex: 1; }
  #estado { color: var(--gris); }
  button { font: inherit; padding: 7px 14px; border: 1px solid var(--linea); border-radius: 7px; background: #fff; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #a1a1aa; }
  button:disabled { color: #a1a1aa; cursor: default; }
  button.principal { background: var(--acento); border-color: var(--acento); color: #fff; }
  #avisos { max-width: 1280px; margin: 14px auto 0; padding: 0 18px; }
  #avisos ul { margin: 0; padding: 10px 14px 10px 30px; background: #fff7ed; border: 1px solid #fdba74; border-radius: 8px; }
  #avisos li { margin: 3px 0; }
  #laminas { max-width: 1280px; margin: 0 auto; padding: 14px 18px 40px; }
  .lamina { margin: 0 0 18px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.14); line-height: 0; }
  .lamina svg { width: 100%; height: auto; display: block; }
  #vacio { margin-top: 60px; padding: 70px 20px; text-align: center; color: var(--gris); border: 2px dashed #d4d4d8;
           border-radius: 12px; background: #fff; }
  body.soltar #vacio, body.soltar .lamina { outline: 3px solid var(--acento); }
  @page { size: 13.333in 7.5in; margin: 0; }
  @media print {
    body { background: #fff; }
    #barra, #avisos, #vacio { display: none !important; }
    #laminas { max-width: none; margin: 0; padding: 0; }
    .lamina { width: 13.333in; height: 7.5in; margin: 0; box-shadow: none; break-after: page; overflow: hidden; }
    .lamina:last-child { break-after: auto; }
    .lamina svg { width: 13.333in; height: 7.5in; }
  }
</style>
</head>
<body>
<header id="barra">
  <strong>Presentación recurrente</strong>
  <button id="btnCargar" class="principal">Cargar datos</button>
  <input type="file" id="archivo" accept=".xlsx" hidden>
  <span id="estado">Sin datos cargados.</span>
  <span class="hueco"></span>
  <button id="btnPdf" disabled title="Abre el diálogo de impresión; elegir Guardar como PDF">PDF</button>
  <button id="btnPptx" disabled>PowerPoint</button>
  <button id="btnPng" disabled>Imágenes PNG</button>
</header>
<div id="avisos"></div>
<main id="laminas">
  <div id="vacio">Arrastra aquí el Excel de datos o usa <b>Cargar datos</b>.<br>El archivo se lee en este navegador y no se envía a ningún lado.</div>
</main>

<script src="lib/pptxgen.bundle.js"></script>
<script src="fotos.js"></script>
<script>
"use strict";
// =====================================================================
//  Cascaron de la presentacion. No lleva datos ni textos propios: todo
//  sale del Excel que se carga (pestañas DATOS, RANKING y TEXTOS).
//  Cada lamina se dibuja en SVG sobre un lienzo de 1920 x 1080; de ese
//  mismo dibujo salen la pantalla, el PDF, los PNG y el pptx.
// =====================================================================

const ANCHO = 1920, ALTO = 1080;
const FUENTE = '"Segoe UI", Arial, sans-serif';
const $ = (s) => document.querySelector(s);

let D = null;        // datos cargados: { datos, textos, ranking, faltan, nombre }
let LAMINAS = [];    // laminas dibujadas: { svg, svgFondo, campos }

// ------------------------------------------------------------- lectura del Excel
// Un .xlsx es un zip de XML. Se lee con el JSZip que ya trae la libreria del pptx.
async function leerExcel(buffer) {
  let zip;
  try { zip = await JSZip.loadAsync(buffer); }
  catch (e) { throw new Error("no es un Excel (.xlsx). Descarga la hoja de datos como Excel y carga ese archivo."); }
  const xml = async (ruta) => {
    const f = zip.file(ruta);
    return f ? new DOMParser().parseFromString(await f.async("string"), "application/xml") : null;
  };
  const libro = await xml("xl/workbook.xml");
  const rels = await xml("xl/_rels/workbook.xml.rels");
  if (!libro || !rels) throw new Error("El archivo no es un Excel (.xlsx) válido.");

  const textoDe = (nodo) => [...nodo.getElementsByTagName("t")]
    .filter((t) => t.parentNode.localName !== "rPh").map((t) => t.textContent).join("");
  const compartidos = [];
  const ss = await xml("xl/sharedStrings.xml");
  if (ss) for (const si of ss.getElementsByTagName("si")) compartidos.push(textoDe(si));

  const destino = {};
  for (const r of rels.getElementsByTagName("Relationship")) destino[r.getAttribute("Id")] = r.getAttribute("Target");
  const NS_R = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const hojas = {};
  for (const h of libro.getElementsByTagName("sheet")) {
    const rid = h.getAttributeNS(NS_R, "id") || h.getAttribute("r:id");
    let ruta = destino[rid] || "";
    ruta = ruta.startsWith("/") ? ruta.slice(1) : "xl/" + ruta;
    const doc = await xml(ruta);
    if (!doc) continue;
    const filas = [];
    for (const fila of doc.getElementsByTagName("row")) {
      const f = [];
      for (const c of fila.getElementsByTagName("c")) {
        const letras = (c.getAttribute("r") || "").replace(/\d+/g, "");
        let col = 0;
        for (const ch of letras) col = col * 26 + (ch.charCodeAt(0) - 64);
        const tipo = c.getAttribute("t");
        const v = c.getElementsByTagName("v")[0];
        let valor = "";
        if (tipo === "s") valor = compartidos[+v.textContent] ?? "";
        else if (tipo === "inlineStr") valor = textoDe(c);
        else if (tipo === "str") valor = v ? v.textContent : "";
        else if (tipo === "b") valor = v && v.textContent === "1";
        else if (v && v.textContent !== "") valor = Number(v.textContent);
        f[col - 1] = valor;
      }
      filas[(+fila.getAttribute("r") || filas.length + 1) - 1] = f;
    }
    hojas[h.getAttribute("name")] = filas;
  }
  return hojas;
}

const plano = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();

function armarModelo(hojas, nombre) {
  const hd = hojas["DATOS"];
  if (!hd || !hd[0]) throw new Error("El archivo no tiene la pestaña DATOS.");
  const enc = hd[0].map(plano);
  const col = (rotulo) => enc.indexOf(rotulo);
  const cClave = col("clave"), cValor = col("valor"), cAjuste = col("ajuste manual"), cFuente = col("fuente"),
        cFecha = col("fecha de la fuente");
  if (cClave < 0 || cValor < 0) throw new Error("La pestaña DATOS no tiene las columnas CLAVE y VALOR.");
  const datos = {};
  hd.slice(1).forEach((f) => {
    if (!f || f[cClave] === undefined || f[cClave] === "") return;
    const aj = cAjuste < 0 ? "" : f[cAjuste];
    const ajustado = aj !== undefined && aj !== "";
    datos[String(f[cClave]).trim()] = { valor: ajustado ? aj : (f[cValor] ?? ""), ajustado,
      fuente: cFuente < 0 ? "" : (f[cFuente] ?? ""), fecha: cFecha < 0 ? "" : (f[cFecha] ?? "") };
  });
  const textos = {};
  (hojas["TEXTOS"] || []).slice(1).forEach((f) => { if (f && f[0]) textos[String(f[0]).trim()] = String(f[1] ?? ""); });
  const ranking = (hojas["RANKING"] || []).slice(1).filter((f) => f && f[0]).map((f) => [String(f[0]), f[1]]);
  return { datos, textos, ranking, faltan: new Set(), nombre };
}

// ------------------------------------------------------------- formato de cifras
const ESP = " ";   // espacio de no separacion, para que una cifra no se parta en dos lineas
const miles = (n, dec = 0) => {
  const [e, d] = Math.abs(n).toFixed(dec).split(".");
  return (n < 0 ? "-" : "") + e.replace(/\B(?=(\d{3})+(?!\d))/g, ESP) + (d ? "." + d : "");
};
const pct = (dec) => (v) => (v * 100).toFixed(dec) + "%";
const FORMATO = {
  "poi.avance": pct(0),
  "eje2.adicional.pct": pct(0),
  "multas.uit": (v) => miles(Math.round(v)),
  "multas.millones": (v) => (v < 10 ? v.toFixed(1) : String(Math.round(v))),
};
function formatear(clave, v) {
  if (typeof v !== "number") return String(v ?? "");
  if (FORMATO[clave]) return FORMATO[clave](v);
  if (/[._]pct$/.test(clave)) return pct(1)(v);
  return miles(Math.round(v));
}
// Dato ya con formato. Lo que falte sale como ¿clave? y queda anotado.
function dato(clave) {
  const d = D.datos[clave];
  if (!d || d.valor === "") { D.faltan.add(clave); return "¿" + clave + "?"; }
  return formatear(clave, d.valor);
}
const numero = (clave) => (D.datos[clave] && typeof D.datos[clave].valor === "number" ? D.datos[clave].valor : 0);
// Texto de la pestaña TEXTOS con sus {claves} ya reemplazadas.
function texto(clave) {
  if (!(clave in D.textos)) { D.faltan.add(clave); return "¿" + clave + "?"; }
  return D.textos[clave].replace(/\{([^{}]+)\}/g, (_, k) => dato(k.trim()));
}
const tieneDato = (clave) => /\{[^{}]+\}/.test(D.textos[clave] || "");

// ------------------------------------------------------------- lienzo SVG
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const medidor = document.createElement("canvas").getContext("2d");
function anchoDe(t, tam, peso) {
  medidor.font = `${peso} ${tam}px ${FUENTE}`;
  return medidor.measureText(t).width;
}
// "uno **dos** tres" -> tramos [{t, b}]
const tramos = (s) => { const r = []; let b = false; String(s).split("**").forEach((p) => { if (p) r.push({ t: p, b }); b = !b; }); return r; };

class Lienzo {
  constructor(n) { this.n = n; this.defs = []; this.fondo = []; this.frente = []; this.campos = []; this.seq = 0; }
  id(p) { return `${p}${this.n}_${++this.seq}`; }
  add(s) { this.fondo.push(s); return this; }

  rect(x, y, w, h, o = {}) {
    return this.add(`<rect x="${x}" y="${y}" width="${w}" height="${h}"${o.r ? ` rx="${o.r}"` : ""} fill="${o.fill || "none"}"` +
      (o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 1}"` : "") + (o.op !== undefined ? ` opacity="${o.op}"` : "") + "/>");
  }
  linea(x1, y1, x2, y2, color, sw = 2) { return this.add(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${sw}"/>`); }
  circulo(cx, cy, r, o = {}) {
    return this.add(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${o.fill || "none"}"` + (o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 1}"` : "") + "/>");
  }
  // Panel con las esquinas redondeadas y, opcional, una pestaña de color a la izquierda, una foto a la
  // derecha o una cabecera de otro color.
  panel(x, y, w, h, fill, o = {}) {
    const clip = this.id("c");
    this.defs.push(`<clipPath id="${clip}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r ?? 16}"/></clipPath>`);
    // La foto ya trae fundido su borde izquierdo con su color de fondo: el panel se pinta de ese color.
    let s = `<g clip-path="url(#${clip})"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.foto ? o.foto.fondo : fill}"/>`;
    if (o.foto) {
      s += `<image href="${o.foto.src}" x="${x + w - o.fotoAncho}" y="${y}" width="${o.fotoAncho}" height="${h}" preserveAspectRatio="xMidYMid slice"/>`;
    }
    if (o.pestana) s += `<rect x="${x}" y="${y}" width="${o.pestanaAncho}" height="${h}" fill="${o.pestana}"/>`;
    if (o.cabecera) s += `<rect x="${x}" y="${y}" width="${w}" height="${o.cabecera.alto}" fill="${o.cabecera.fill}"/>`;
    return this.add(s + "</g>");
  }
  // Anillo de avance. `fraccion` de 0 a 1; por encima de 1 se dibuja completo.
  anillo(cx, cy, r, grosor, fraccion, color, pista) {
    const rm = r - grosor / 2, largo = 2 * Math.PI * rm, f = Math.max(0, Math.min(1, fraccion || 0));
    this.circulo(cx, cy, rm, { stroke: pista, sw: grosor });
    return this.add(`<circle cx="${cx}" cy="${cy}" r="${rm}" fill="none" stroke="${color}" stroke-width="${grosor}" ` +
      `stroke-dasharray="${(largo * f).toFixed(2)} ${largo.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`);
  }
  icono(nombre, cx, cy, r, color, trazo = "#fff") {
    const g = (d, extra = "") => `<g transform="translate(${cx} ${cy}) scale(${r})" fill="none" stroke="${trazo}" stroke-width="0.09" stroke-linecap="round" stroke-linejoin="round"${extra}>${d}</g>`;
    const base = color ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>` : "";
    const contra = color || "#fff";                 // color para lo que se dibuja sobre un relleno
    const R = `fill="${trazo}" stroke="none"`;      // figura rellena
    const DIBUJOS = {
      escudo: `<path d="M0,-0.56 L0.44,-0.38 V0.02 C0.44,0.32 0.2,0.5 0,0.58 C-0.2,0.5 -0.44,0.32 -0.44,0.02 V-0.38 Z"/><path d="M-0.2,0.02 L-0.05,0.18 L0.22,-0.14"/>`,
      visto: `<path d="M-0.36,0.02 L-0.1,0.28 L0.38,-0.26" stroke-width="0.16"/>`,
      vistoAro: `<circle r="0.8"/><path d="M-0.34,0.02 L-0.1,0.26 L0.36,-0.24" stroke-width="0.16"/>`,
      engranaje: `<circle r="0.33" stroke-width="0.17"/>` + [0, 45, 90, 135, 180, 225, 270, 315].map((a) => `<rect x="-0.1" y="-0.64" width="0.2" height="0.22" rx="0.03" fill="${trazo}" stroke="none" transform="rotate(${a})"/>`).join(""),
      reloj: `<circle r="0.86" stroke-width="0.14"/><path d="M0,-0.46 V0 L0.3,0.2" stroke-width="0.14"/>`,
      documento: `<path d="M-0.5,-0.9 H0.2 L0.55,-0.55 V0.9 H-0.5 Z M0.2,-0.9 V-0.55 H0.55" stroke-width="0.11"/><path d="M-0.28,-0.4 H0.1 M-0.28,-0.12 H0.3 M-0.28,0.16 H0.0" stroke-width="0.1"/>` +
                 `<rect x="0.08" y="0.3" width="0.62" height="0.62" rx="0.08" ${R}/><path d="M0.2,0.5 H0.58 M0.2,0.7 H0.58 M0.39,0.42 V0.82" stroke="${contra}" stroke-width="0.07"/>`,
      persona: `<circle cy="-0.32" r="0.27" ${R}/><path d="M-0.55,0.62 C-0.55,0.12 -0.25,0.04 0,0.04 C0.25,0.04 0.55,0.12 0.55,0.62 Z" ${R}/>`,
      personas: `<circle cy="-0.3" r="0.22" ${R}/><path d="M-0.36,0.52 C-0.36,0.1 -0.16,0.02 0,0.02 C0.16,0.02 0.36,0.1 0.36,0.52 Z" ${R}/>` +
                `<circle cx="-0.55" cy="-0.16" r="0.16" ${R}/><circle cx="0.55" cy="-0.16" r="0.16" ${R}/>` +
                `<path d="M-0.44,0.52 C-0.44,0.3 -0.42,0.18 -0.36,0.1 C-0.6,0.02 -0.9,0.12 -0.9,0.52 Z" ${R}/><path d="M0.44,0.52 C0.44,0.3 0.42,0.18 0.36,0.1 C0.6,0.02 0.9,0.12 0.9,0.52 Z" ${R}/>`,
      barras: `<rect x="-0.52" y="0.08" width="0.26" height="0.42" rx="0.04" ${R}/><rect x="-0.13" y="-0.18" width="0.26" height="0.68" rx="0.04" ${R}/><rect x="0.26" y="-0.48" width="0.26" height="0.98" rx="0.04" ${R}/>`,
      portapapeles: `<rect x="-0.44" y="-0.5" width="0.88" height="1.08" rx="0.08"/><rect x="-0.2" y="-0.64" width="0.4" height="0.24" rx="0.06" ${R}/><path d="M-0.24,-0.12 H0.24 M-0.24,0.12 H0.24 M-0.24,0.36 H0.08"/>`,
      diana: `<circle r="0.6"/><circle r="0.32"/><circle r="0.09" ${R}/><path d="M0.06,-0.06 L0.62,-0.62 M0.4,-0.64 H0.64 V-0.4"/>`,
      calendario: `<rect x="-0.55" y="-0.45" width="1.1" height="1" rx="0.1"/><path d="M-0.55,-0.16 H0.55 M-0.28,-0.62 V-0.36 M0.28,-0.62 V-0.36"/>` +
                  [-0.3, 0, 0.3].map((x) => [0.06, 0.32].map((y) => `<rect x="${x - 0.07}" y="${y - 0.07}" width="0.14" height="0.14" ${R}/>`).join("")).join(""),
      historial: `<path d="M-0.7,-0.2 A0.74,0.74 0 1 1 -0.58,0.46" stroke-width="0.13"/><path d="M-0.95,-0.42 L-0.7,-0.16 L-0.4,-0.38" stroke-width="0.13"/><path d="M0.04,-0.38 V0.04 L0.34,0.22" stroke-width="0.13"/>`,
      docVisto: `<path d="M-0.56,-0.74 H0.1 L0.4,-0.44 V0.2 M0.02,0.62 H-0.56 V-0.74" stroke-width="0.1"/><path d="M-0.32,-0.34 H0.14 M-0.32,-0.08 H0.14 M-0.32,0.18 H-0.02" stroke-width="0.1"/>` +
                `<circle cx="0.36" cy="0.5" r="0.34" ${R}/><path d="M0.2,0.5 L0.32,0.63 L0.54,0.38" stroke="${contra}" stroke-width="0.1"/>`,
      docLupa: `<path d="M-0.5,-0.72 H0.14 L0.44,-0.42 V0.02 M-0.02,0.66 H-0.5 V-0.72" stroke-width="0.1"/><path d="M-0.28,-0.34 H0.18 M-0.28,-0.08 H0.0" stroke-width="0.1"/>` +
               `<circle cx="0.26" cy="0.36" r="0.22" stroke-width="0.1"/><path d="M0.42,0.52 L0.64,0.74" stroke-width="0.13"/>`,
      docEngranaje: `<path d="M-0.5,-0.72 H0.14 L0.44,-0.42 V-0.06 M-0.08,0.66 H-0.5 V-0.72" stroke-width="0.1"/><path d="M-0.28,-0.34 H0.18 M-0.28,-0.08 H0.0 M-0.28,0.18 H-0.06" stroke-width="0.1"/>` +
                    `<circle cx="0.34" cy="0.4" r="0.1" stroke-width="0.09"/><circle cx="0.34" cy="0.4" r="0.24" stroke-width="0.14" stroke-dasharray="0.125 0.064"/>`,
      docs: `<path d="M-0.2,-0.5 V-0.8 H0.34 L0.66,-0.48 V0.5 H0.38" stroke-width="0.09"/>` +
            `<path d="M-0.62,-0.5 H-0.02 L0.3,-0.18 V0.8 H-0.62 Z" stroke-width="0.09"/><path d="M-0.4,-0.02 H0.08 M-0.4,0.22 H0.08 M-0.4,0.46 H0.08" stroke-width="0.09"/>`,
      casco: `<path d="M-0.5,0.02 C-0.5,-0.68 0.5,-0.68 0.5,0.02 Z" ${R}/><rect x="-0.66" y="0.02" width="1.32" height="0.16" rx="0.08" ${R}/>` +
             `<path d="M-0.5,0.82 C-0.5,0.4 -0.24,0.34 0,0.34 C0.24,0.34 0.5,0.4 0.5,0.82 Z" ${R}/>`,
      fabrica: `<path d="M-0.7,0.62 V0.02 L-0.32,0.28 V0.02 L0.06,0.28 V-0.62 H0.36 V0.28 H0.7 V0.62 Z" ${R}/>` +
               `<path d="M-0.5,0.44 H-0.34 M-0.14,0.44 H0.02 M0.22,0.44 H0.38" stroke="${contra}" stroke-width="0.1"/>`,
      puente: `<path d="M-0.8,0.3 H0.8 M-0.46,-0.5 V0.56 M0.46,-0.5 V0.56 M-0.8,0.12 C-0.62,-0.06 -0.52,-0.28 -0.46,-0.44 C-0.3,0.08 0.3,0.08 0.46,-0.44 C0.52,-0.28 0.62,-0.06 0.8,0.12" stroke-width="0.1"/>` +
              `<path d="M-0.22,-0.02 V0.3 M0,0.06 V0.3 M0.22,-0.02 V0.3" stroke-width="0.07"/>`,
      cilindros: `<ellipse cy="-0.44" rx="0.5" ry="0.18" stroke-width="0.1"/><path d="M-0.5,-0.44 V0.44 C-0.5,0.68 0.5,0.68 0.5,0.44 V-0.44 M-0.5,-0.14 C-0.5,0.1 0.5,0.1 0.5,-0.14 M-0.5,0.16 C-0.5,0.4 0.5,0.4 0.5,0.16" stroke-width="0.1"/>`,
      surtidor: `<rect x="-0.52" y="-0.66" width="0.64" height="1.32" rx="0.08" ${R}/><rect x="-0.4" y="-0.52" width="0.4" height="0.34" rx="0.04" fill="${contra}" stroke="none"/>` +
                `<path d="M0.12,-0.08 H0.3 V0.42 C0.3,0.6 0.56,0.6 0.56,0.42 V-0.3 L0.36,-0.52" stroke-width="0.1"/>`,
      monedas: [0, 1, 2].map((i) => `<ellipse cx="-0.3" cy="${(0.44 - i * 0.18).toFixed(2)}" rx="0.3" ry="0.12" fill="${trazo}" stroke="${contra}" stroke-width="0.045"/>`).join("") +
               [0, 1, 2, 3, 4].map((i) => `<ellipse cx="0.3" cy="${(0.44 - i * 0.18).toFixed(2)}" rx="0.3" ry="0.12" fill="${trazo}" stroke="${contra}" stroke-width="0.045"/>`).join(""),
    };
    return this.add(base + g(DIBUJOS[nombre]));
  }

  // Texto. o: tam, peso (400, 600, 700), color, ancla (start | middle | end), ancho (envuelve),
  // inter (alto de linea en veces el tamaño), centroY (y es el centro del bloque), encoger (ancho
  // maximo de una sola linea), campo (va como cuadro de texto editable en el pptx), parrafo
  // (en el pptx, un solo cuadro que envuelve, de `alto` pixeles). Devuelve la y de la linea siguiente.
  texto(x, y, cadena, o = {}) {
    let tam = o.tam || 28;
    const peso = o.peso || 400, color = o.color || "#111", ancla = o.ancla || "start", inter = o.inter || 1.22;
    const pesoDe = (b) => (b ? 700 : peso);
    let lineas = [];
    for (const parte of String(cadena).split("\n")) {
      if (!o.ancho) { lineas.push(tramos(parte)); continue; }
      let actual = [], w = 0;
      const espacio = anchoDe(" ", tam, peso);
      for (const tr of tramos(parte)) for (const palabra of tr.t.split(/ +/).filter(Boolean)) {
        const wp = anchoDe(palabra, tam, pesoDe(tr.b));
        if (actual.length && w + espacio + wp > o.ancho) { lineas.push(actual); actual = []; w = 0; }
        const ultimo = actual[actual.length - 1];
        if (ultimo && ultimo.b === tr.b) ultimo.t += " " + palabra;
        else { if (ultimo) ultimo.t += " "; actual.push({ t: palabra, b: tr.b }); }
        w += (actual.length > 1 || ultimo ? espacio : 0) + wp;
      }
      lineas.push(actual);
    }
    const anchoLinea = (l) => l.reduce((s, tr) => s + anchoDe(tr.t, tam, pesoDe(tr.b)), 0);
    if (o.encoger && lineas.length === 1) {
      const w = anchoLinea(lineas[0]);
      if (w > o.encoger) tam = Math.floor(tam * o.encoger / w);
    }
    const paso = tam * inter;
    let y0 = y;
    if (o.centroY) y0 = y - (lineas.length - 1) * paso / 2 + tam * 0.35;
    const destino = o.campo ? this.frente : this.fondo;
    lineas.forEach((l, i) => {
      if (!l.length) return;
      destino.push(`<text x="${x}" y="${(y0 + i * paso).toFixed(1)}" font-family='${FUENTE}' font-size="${tam}" font-weight="${peso}" fill="${color}" text-anchor="${ancla}" xml:space="preserve">` +
        l.map((tr) => (tr.b && peso < 700 ? `<tspan font-weight="700">${esc(tr.t)}</tspan>` : esc(tr.t))).join("") + "</text>");
    });
    if (o.campo) {
      this.campos.push({ x, y: y0, lineas, tam, peso, color, ancla, paso, ancho: o.ancho || 0, parrafo: !!o.parrafo, alto: o.alto || 0,
                         anchos: lineas.map(anchoLinea) });
    }
    return y0 + lineas.length * paso;
  }
  // Texto de la pestaña TEXTOS: es campo editable si lleva algun {dato}.
  rotulo(x, y, clave, o = {}) { return this.texto(x, y, texto(clave), { campo: tieneDato(clave), ...o }); }
  // Dato suelto de la pestaña DATOS: siempre editable.
  cifra(x, y, clave, o = {}) { return this.texto(x, y, (o.antes || "") + dato(clave), { campo: true, ...o }); }

  svg(conCampos = true) {
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${ANCHO} ${ALTO}" width="${ANCHO}" height="${ALTO}">` +
      `<defs>${this.defs.join("")}</defs><rect width="${ANCHO}" height="${ALTO}" fill="#fff"/>` +
      this.fondo.join("") + (conCampos ? this.frente.join("") : "") + "</svg>";
  }
}

}

// Tabla del ranking: encabezado y hasta 5 filas (las que traiga la pestaña RANKING).
function tablaRanking(L, x, y, w, h) {
  const filas = D.ranking.slice(0, 5), altoEnc = 52, altoFila = (h - altoEnc) / 5, w1 = Math.round(w * 0.68), borde = C.azul;
  L.rect(x, y, w, altoEnc, { fill: C.azul });
  L.rotulo(x + w1 / 2, y + 36, "l1.ranking.col1", { tam: 26, peso: 700, color: "#fff", ancla: "middle" });
  L.rotulo(x + w1 + (w - w1) / 2, y + 36, "l1.ranking.col2", { tam: 26, peso: 700, color: "#fff", ancla: "middle" });
  L.rect(x, y + altoEnc, w, altoFila * filas.length, { fill: "#fff" });
  filas.forEach(([nombre, monto], i) => {
    const yb = y + altoEnc + altoFila * i;
    L.linea(x, yb + altoFila, x + w, yb + altoFila, borde, 1.5);
    L.texto(x + 14, yb + altoFila / 2 + 9, nombre, { tam: 24, color: "#111", encoger: w1 - 28, campo: true });
    L.texto(x + w - 16, yb + altoFila / 2 + 9, typeof monto === "number" ? miles(monto, 3) : String(monto ?? ""),
            { tam: 24, color: "#111", ancla: "end", campo: true });
  });
  const alto = altoEnc + altoFila * filas.length;
  L.rect(x, y, w, alto, { stroke: borde, sw: 2 });
  L.linea(x + w1, y, x + w1, y + alto, borde, 1.5);
}

const partes = (clave) => texto(clave).split("|").map((p) => p.trim());

// Caja pequeña del organigrama. "E1" se escribe con el numero como subindice.
function ficha(L, x, y, w, h, rotulo) {
  L.rect(x, y, w, h, { fill: "#fff", stroke: "#d4d4d8", sw: 1.5, r: 7 });
  const m = /^(\D+)(\d+)$/.exec(rotulo);
  if (!m) { L.texto(x + w / 2, y + h / 2 + 9, rotulo, { tam: 25, color: "#1f2f4a", ancla: "middle", encoger: w - 8 }); return; }
  L.add(`<text x="${x + w / 2}" y="${y + h / 2 + 9}" font-family='${FUENTE}' font-size="26" fill="#1f2f4a" text-anchor="middle">${esc(m[1])}` +
        `<tspan font-size="16" dy="7">${esc(m[2])}</tspan></text>`);
}

// Columna del organigrama: cabecera con icono, nombre y rol, y debajo sus fichas.
function columnaOrg(L, x, y, w, h, clave, icono, colorCab, colorCuerpo, porFila) {
  const [nombre, rol, lista] = partes(clave), altoCab = 70;
  L.panel(x, y, w, h, colorCuerpo, { r: 10, cabecera: { alto: altoCab, fill: colorCab } });
  L.icono(icono, x + 50, y + altoCab / 2, 25, null, C.azul);
  L.texto(x + 92, y + 31, nombre || "", { tam: 27, peso: 700, color: C.azul, encoger: w - 100 });
  L.texto(x + 92, y + 58, rol || "", { tam: 22, color: "#1f2f4a", encoger: w - 100 });
  const fichas = (lista || "").split(",").map((s) => s.trim()).filter(Boolean), fw = 56, fh = 48, sep = 10;
  fichas.forEach((f, i) => {
    const fila = Math.floor(i / porFila), enFila = Math.min(porFila, fichas.length - fila * porFila);
    const x0 = x + (w - (enFila * fw + (enFila - 1) * sep)) / 2;
    ficha(L, x0 + (i % porFila) * (fw + sep), y + altoCab + 16 + fila * (fh + 12), fw, fh, f);
  });
}

// ------------------------------------------------------------- pantalla
function dibujar() {
  D.faltan = new Set();
  LAMINAS = DIBUJANTES.map((f) => f());
  $("#laminas").innerHTML = LAMINAS.map((L) => `<section class="lamina">${L.svg()}</section>`).join("");
  const avisos = [];
  const fin = D.datos["periodo.fin"] ? String(D.datos["periodo.fin"].valor) : "";
  const iso = (f) => String(f).split(".").reverse().join("-");
  const viejas = {};
  Object.values(D.datos).forEach((d) => { if (d.fecha && fin && iso(d.fecha) < fin) viejas[`${String(d.fuente).split(":")[0]} (datos al ${d.fecha})`] = true; });
  Object.keys(viejas).forEach((v) => avisos.push(`Fuente anterior al corte: ${v}.`));
  const ajustados = Object.keys(D.datos).filter((k) => D.datos[k].ajustado);
  if (ajustados.length) avisos.push(`Con ajuste manual: ${ajustados.join(", ")}.`);
  if (D.faltan.size) avisos.push(`Faltan en el Excel: ${[...D.faltan].join(", ")}. En la lámina salen entre signos de interrogación.`);
  $("#avisos").innerHTML = avisos.length ? `<ul>${avisos.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>` : "";
  const corte = D.datos.corte ? D.datos.corte.valor : "";
  $("#estado").textContent = `${D.nombre}${corte ? " · corte " + corte : ""} · ${LAMINAS.length} lámina(s)`;
  ["#btnPdf", "#btnPptx", "#btnPng"].forEach((b) => { $(b).disabled = false; });
}

async function cargarBuffer(buffer, nombre) {
  try {
    D = armarModelo(await leerExcel(buffer), nombre);
    dibujar();
  } catch (e) {
    $("#estado").textContent = "No se pudo leer el archivo: " + e.message;
    console.error(e);
  }
}
const cargarArchivo = (f) => f && f.arrayBuffer().then((b) => cargarBuffer(b, f.name));

// ------------------------------------------------------------- exportacion
function pngDeSvg(svg, escala = 2) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = ANCHO * escala; c.height = ALTO * escala;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL("image/png"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error("No se pudo convertir la lámina a imagen.")); };
    img.src = url;
  });
}
const nombreSalida = () => "Presentacion " + (D.datos.corte ? D.datos.corte.valor : "sin corte");

function descargar(url, nombre) {
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
}

async function exportarPng() {
  for (let i = 0; i < LAMINAS.length; i++) descargar(await pngDeSvg(LAMINAS[i].svg()), `${nombreSalida()} lamina ${i + 1}.png`);
}

// Medidas de Segoe UI en PowerPoint, en veces el tamaño: de la linea base al borde superior del cuadro
// de texto (medido el 12/11/2026 comparando el pptx con la pagina) y alto de la caja de linea.
const SUBE = 0.948, CAJA = 1.33;
const PX = 144;   // pixeles del lienzo por pulgada de la diapositiva (1920 / 13.333)

// "#fff" -> "FFFFFF": el pptx solo entiende colores de seis digitos (con tres, PowerPoint pinta negro).
const hex6 = (c) => { const h = c.replace("#", ""); return (h.length === 3 ? h.replace(/./g, "$&$&") : h).toUpperCase(); };

// Arma el pptx. Cada lamina: la imagen sin los campos como fondo y cada campo como cuadro de texto.
async function armarPptx() {
  const p = new PptxGenJS();
  p.defineLayout({ name: "LAMINA", width: ANCHO / PX, height: ALTO / PX });
  p.layout = "LAMINA";
  for (const L of LAMINAS) {
    const s = p.addSlide();
    s.addImage({ data: await pngDeSvg(L.svg(false)), x: 0, y: 0, w: ANCHO / PX, h: ALTO / PX });
    for (const c of L.campos) {
      const comun = { fontFace: c.peso === 600 ? "Segoe UI Semibold" : "Segoe UI", fontSize: c.tam / 2, bold: c.peso >= 700,
                      color: hex6(c.color), margin: 0, valign: "top",
                      align: c.ancla === "middle" ? "center" : c.ancla === "end" ? "right" : "left" };
      const tramosDe = (l, salto) => l.map((tr, i) => ({ text: tr.t, options: { bold: c.peso >= 700 || tr.b, breakLine: salto && i === l.length - 1 } }));
      if (c.parrafo) {
        // un solo cuadro que envuelve, para escribir o corregir un parrafo entero
        const lineas = c.lineas.filter((l) => l.length);
        s.addText(lineas.length ? lineas.flatMap((l, i) => tramosDe(l, i < lineas.length - 1)) : " ",
          { ...comun, x: c.x / PX, y: (c.y - SUBE * c.tam) / PX, w: (c.ancho || 400) / PX, h: (c.alto || 4 * c.paso) / PX,
            wrap: true, lineSpacingMultiple: c.paso / (CAJA * c.tam) });
        continue;
      }
      c.lineas.forEach((l, i) => {
        if (!l.length) return;
        // un cuadro por linea, sin ajuste de linea, con holgura a los lados
        const w = c.anchos[i] + c.tam * 1.2;
        const x = c.ancla === "middle" ? c.x - w / 2 : c.ancla === "end" ? c.x - w : c.x;
        s.addText(tramosDe(l, false), { ...comun, x: x / PX, y: (c.y + i * c.paso - SUBE * c.tam) / PX, w: w / PX, h: CAJA * c.tam / PX, wrap: false });
      });
    }
  }
  return p;
}
async function exportarPptx() {
  const b = $("#btnPptx");
  b.disabled = true;
  try { await (await armarPptx()).writeFile({ fileName: nombreSalida() + ".pptx" }); }
  catch (e) { $("#estado").textContent = "No se pudo crear el PowerPoint: " + e.message; console.error(e); }
  b.disabled = false;
}
